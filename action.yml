name: 'QueryGuard Sentinel'
author: 'Munir Pathak'
description: 'PostgreSQL migration lock linter and synthetic query-plan smoke test.'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  schema-path:
    description: 'Path to baseline schema DDL (e.g., pg_dump --schema-only). Applied without lock checks.'
    required: false
    default: ''
  migration-path:
    description: 'Path to incoming PR migration DDL. Analyzed for ACCESS EXCLUSIVE and SHARE locks.'
    required: false
    default: ''
  queries-path:
    description: 'Path to SQL queries file to evaluate'
    required: true
    default: 'test/queries.sql'
  pg-host:
    description: 'PostgreSQL host'
    required: false
    default: 'localhost'
  pg-port:
    description: 'PostgreSQL port'
    required: false
    default: '5432'
  pg-user:
    description: 'PostgreSQL user'
    required: false
    default: 'postgres'
  pg-password:
    description: 'PostgreSQL password'
    required: false
    default: 'postgres'
  pg-database:
    description: 'PostgreSQL database name'
    required: false
    default: 'postgres'
  mock-rows:
    description: 'Simulated row count for catalog optimizer mocking'
    required: false
    default: '2000'
  fail-on-sev1:
    description: 'Strict mode: fail the job on lock hazards (exit 1) or an INCONCLUSIVE run (exit 2). Sequential scans on synthetic data are informational and never fail the job.'
    required: false
    default: 'false'
  assume-in-transaction:
    description: 'Set to true if your migration runner wraps each file in a transaction (Rails and Django do by default). CREATE INDEX CONCURRENTLY is then flagged, and the migration is executed inside BEGIN/COMMIT.'
    required: false
    default: 'false'
  snapshot-path:
    description: 'Path to a queryguard snapshot directory committed to the repo (e.g. .queryguard/snapshot). Lock findings are annotated with production row counts, sizes and traffic. An invalid snapshot makes the run INCONCLUSIVE. This workflow never needs production credentials.'
    required: false
    default: ''
  snapshot-max-age-days:
    description: 'A snapshot older than this many days gets a stale warning at the top of the report.'
    required: false
    default: '14'
  github-token:
    description: 'GITHUB_TOKEN for PR commenting'
    required: false
    default: ''

runs:
  using: 'node24'
  main: 'dist/index.js'
