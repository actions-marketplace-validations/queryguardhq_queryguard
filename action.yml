name: 'QueryGuard'
author: 'Munir Pathak'
description: 'Pre-merge PostgreSQL blast-radius and migration lock analyzer.'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  schema-path:
    description: 'Path to baseline schema DDL (e.g., pg_dump --schema-only). Applied without lock checks.'
    required: false
    default: ''
  migration-path:
    description: 'Path to incoming PR migration DDL. Analyzed for ACCESS EXCLUSIVE and SHARE locks.'
    required: false
    default: ''
  queries-path:
    description: 'Path to SQL queries file to evaluate'
    required: true
    default: 'test/queries.sql'
  pg-host:
    description: 'PostgreSQL host'
    required: false
    default: 'localhost'
  pg-port:
    description: 'PostgreSQL port'
    required: false
    default: '5432'
  pg-user:
    description: 'PostgreSQL user'
    required: false
    default: 'postgres'
  pg-password:
    description: 'PostgreSQL password'
    required: false
    default: 'postgres'
  pg-database:
    description: 'PostgreSQL database name'
    required: false
    default: 'postgres'
  mock-rows:
    description: 'Simulated row count for catalog optimizer mocking'
    required: false
    default: '2000'
  fail-on-sev1:
    description: 'Block merge if a critical sequential scan or lock is detected'
    required: false
    default: 'false'
  github-token:
    description: 'GITHUB_TOKEN for PR commenting'
    required: false
    default: ''

runs:
  using: 'node20'
  main: 'dist/index.js'
