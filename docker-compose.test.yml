# Postgres servers for the test suite. Ports avoid 5432 so they never collide with a dev database.
#   postgres  Postgres 16 on 5433: the migration lint, dry run and query-plan tests.
#   pg14-18   Postgres 14-18 on 5414-5418 with pg_stat_statements preloaded: the snapshot tests.
# GitHub service containers cannot pass server flags, so CI starts this same file.
x-snapshot-server: &snapshot-server
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
  command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top"]
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "postgres"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  pg14:
    <<: *snapshot-server
    image: postgres:14-alpine
    ports: ["5414:5432"]
  pg15:
    <<: *snapshot-server
    image: postgres:15-alpine
    ports: ["5415:5432"]
  pg16:
    <<: *snapshot-server
    image: postgres:16-alpine
    ports: ["5416:5432"]
  pg17:
    <<: *snapshot-server
    image: postgres:17-alpine
    ports: ["5417:5432"]
  pg18:
    <<: *snapshot-server
    image: postgres:18-alpine
    ports: ["5418:5432"]
