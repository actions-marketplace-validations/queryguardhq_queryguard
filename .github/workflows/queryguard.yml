name: QueryGuard PR Sentinel

on:
  pull_request:

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  queryguard:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      # Runs the committed, bundled dist/ exactly as Action users do (the `dist` job in
      # test.yml guarantees it matches the source).
      - name: Run QueryGuard Action
        run: |
          node dist/index.js \
            --schema test/schema.sql \
            --queries test/queries.sql \
            --token "${{ secrets.GITHUB_TOKEN }}"
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: testdb
          FAIL_ON_SEV1: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
