name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Rebuild Distribution Bundle
        run: |
          npm run build
          chmod +x dist/index.js

      - name: Ensure Clean Working Tree for Provenance
        run: |
          git status --porcelain
          git checkout -- .
          git clean -fd

      - name: Publish to npm with Provenance
        run: npm publish --provenance --access public
