name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # The Action declares the node24 runtime; 20 is the oldest Node the npm package supports.
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Postgres 16 plus the 14-18 snapshot matrix (pg_stat_statements preloaded); see docker-compose.test.yml.
      - run: npm run test:db:up
      - run: npm test

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # dist/ is what the Action and the npm bin actually run, so it must match the source.
  dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fail if dist/ is stale
        run: |
          if ! git diff --exit-code dist/ || [ -n "$(git ls-files --others --exclude-standard dist/)" ]; then
            echo "::error title=dist/ is out of date::Run 'npm run build' and commit the result."
            exit 1
          fi
